title = "Exécuter et retrouver la première boucle BMad réelle"
description = "Réalise le tracer complet avec les contrats et le stockage de 2 et la voie Codex de 1. Avant invocation, qualifie dans un dossier d'essai dédié le profil BMad et un workflow réellement installé : empreinte, identité/invocation, contexte requis, interactions et effets annoncés. Son parcours textuel complet doit fonctionner sans les contrôles encore prévus en 5–7 ; sinon choisir une autre référence qualifiée ou bloquer et revoir le découpage, sans tronquer ni simuler les conditions natives. Vérifie le processus Codex lancé depuis le paquet, son environnement, réseau et certificats. Capture projet/initiative/fournisseur/connexion, affiche l'invocation et conserve dialogue réel, accusés et brouillon ; G1 reste partiel."
verify = "Dans le paquet Windows installé, vérifier le profil et le parcours avant exécution, puis invoquer le workflow qualifié sur le dossier d'essai et accomplir son dialogue textuel complet ; fermer puis rouvrir retrouve échanges et brouillon sans lancement de moteur. Consigner versions, effets attendus/observés, contexte, événements et accès réseau/certificats du processus Codex réellement lancé ; toute interaction native non disponible impose un réexamen avant invocation."
