# Decoupage Sofia approuve par le porteur le 2026-10-23 : 11 entrees.
# Exception validee : qualification (1), G0 (2), puis tracer complet (3).
# Commit local autorise ; le lancement d'une entree reste une etape distincte.
# Mandat autonome du 2026-10-23 : G0 local (2) peut avancer sans auth ; le tracer (3) attend 1 et 2.
# Replan du 2026-10-24 : 12 qualifie le profil local effectivement livre avant 3.
# 1 et 2 restent obligatoires pour le nettoyage final et la cloture/distribution ; plans historiques preserves.
# Replan du 2026-10-28 : périmètre personnel local, code privé et abonnement ChatGPT.
# 1 est abandonnée comme hors périmètre ; 10 attend 2,12,3–9 ; 11 garde les contrôles intégrés personnels.
# Les commentaires antérieurs et entrées built sont historiques ; leurs plans ne sont pas réécrits.

