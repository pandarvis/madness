after = [1,2]
hitl = false
risk = "high"
references = ["_bmad-output/initiative-madness/architecture-madness/architecture-madness.md","_bmad-output/initiative-madness/ux-madness/EXPERIENCE.md","_bmad-output/initiative-madness/ux-madness/DESIGN.md"]

