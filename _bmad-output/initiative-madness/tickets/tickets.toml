# Découpage Sofia approuvé par le porteur le 23 octobre 2026.
# Les quatre epics sont raffinés ; entrées3/4 adoptées le3novembre2026 sous mandat autonome.
# L'ordre et les identifiants 1–4 sont conservés ; les identifiants ne sont pas réutilisés.

[[epic]]
id = 1
slug = "epic-boucle-codex"
title = "Dialoguer réellement avec Codex dans Madness"
description = "Une première version Windows personnelle installable ouvre un dossier BMad de référence, lance un workflow avec Codex et l’abonnement ChatGPT du porteur, permet questions et approbations, puis montre le résultat et les chemins produits. Elle qualifie G0/G1 et le profil BMad de référence nécessaire à cette preuve, possède les contrats partagés, la conservation locale et la procédure de reconstruction ; les capacités réelles et les limites sont visibles."
covers = ["R12", "R13", "R14", "R15", "R16", "R17", "R18", "R22", "R25", "R27"]

[[epic]]
id = 2
slug = "epic-projets-bmad"
title = "Comprendre et piloter ses projets BMad existants"
description = "Depuis le socle et le dialogue de l'epic 1, une version Windows installable retrouve plusieurs projets et leurs initiatives, qualifie le profil BMad G2, montre état et preuves, propose l'aide et tout le catalogue installé, puis rejoint la conversation réelle. Elle établit avant ses consommateurs les règles et extensions de contrats nécessaires au temps et au coût par US, qualifie les données disponibles puis affiche mesures et indisponibilités. Elle livre les aperçus et l'ouverture éditeur, la navigation accessible ainsi que français/anglais et clair/sombre après extension des contrats par Sally."
covers = ["R1", "R2", "R3", "R5", "R6", "R7", "R8", "R9", "R10", "R11", "R19", "R20", "R21", "R26", "R32"]
after = [{ epic = 1, needs = "paquet Windows et contrats de contexte, dialogue Codex, cycle de vie et persistance établis par G0/G1" }, { epic = 4, needs = "4.4 : premier Graphe et destinations projet intégrés avant la reprise2.9 et ses consommateurs, après le fournisseur fichiers2.8" }]

[[epic]]
id = 3
slug = "epic-initialisation-bmad"
title = "Initialiser un projet et qualifier les parcours Windows"
description = "À partir du diagnostic, des projets et de l'interface de l'epic 2, une version Windows installable initialise BMad avec plan exact, accord, annulation et résultat vérifié. Elle réunit les preuves G3, dont l'ouverture éditeur fournie par l'epic 2, puis G4 sur machine cible : les trois parcours réels avec novice, restauration et remplacement du programme."
covers = ["R4", "R23", "R24"]
after = [{ epic = 1, needs = "1.11 : socle Windows/Codex, contrats communs, cycle de vie, persistance et paquet réellement construits pour les qualifications possédées" }, { epic = 2, needs = "2.1/2.3 : diagnostic et contexte pour3.1 ; 2.17/2.14 : règles et variantes avant3.2 ; 2.15 : contrats et implémentation revue avant la voie produit3.3 ; 2.16 : capacités intégrées, fichiers/éditeur et preuves du paquet avant qualification3.9 et G3/G4" }]

[[epic]]
id = 4
slug = "epic-graphe-projet"
title = "Explorer le graphe du code et des dépendances"
description = "Sur la base Windows/Codex construite, qualifie localement Graphify puis livre dans le paquet Windows un onglet Graphe du projet ouvert : recherche, zoom, relations accessibles et nœud vers fichier, provenance, confiance et fraîcheur. Les contrats du cœur et le supplément UX Sally/Impeccable précèdent la voie produit avec un premier onglet4.4 après fichiers2.8, puis des compléments4.5 après implémentation revue3.8 et la couverture de variantes4.8 après2.14. G4 reste requis à la qualification finale G5 ; livraison obligatoire en V1, usage optionnel."
covers = ["R28", "R29", "R30", "R31"]
after = [{ epic = 1, needs = "1.11 : base Windows/Codex, contrats, cycle de vie, persistance et paquet pour qualification locale indépendante4.1 et contrats4.3" }, { epic = 2, needs = "2.3 : contexte projet pour4.1 ; 2.17 : règles pour supplément UX4.2 ; 2.8 : panneau fichiers/éditeur avant premier onglet4.4 ; 2.14 : infrastructure de variantes consommée par4.8" }, { epic = 3, needs = "3.8 : implémentation revue avant compléments4.5, premier onglet4.4 préservé ; 3.9 : opérations G3 et paquet réellement qualifiés avant4.11 ; 3.10 : vraie qualification G4 avant matrice finale4.11, sans gate entier sur4.1–4.3" }]

[[epic]]
id = 5
slug = "epic-couts-usd"
title = "Consulter les coûts en dollars par epic et par US"
description = "Qualifie une source monétaire autorisée, conserve les reçus USD avec attribution et déduplication, puis présente les coûts par US et le total par epic avec leur provenance et leur couverture dans Madness."
covers = ["R33"]
after = [{ epic = 2, needs = "2.10 : preuve de source ; 2.11 : identité d’occurrence et persistance ; 2.13–2.14 : parcours et variantes des mesures" }]


