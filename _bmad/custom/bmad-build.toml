[workflow]
persistent_facts = [
  "Décision explicite du porteur du 27 octobre 2026 : aucun seuil arbitraire de longueur des plans en tokens. Rédiger le plan aussi long que nécessaire pour être clair, complet et utilisable, en évitant les répétitions. Ne pas compter ni présenter un objectif de tokens comme critère d’acceptation du plan ; ne demander ni découpage, ni raccourcissement, ni approbation à cause de sa longueur. Cette consigne humaine prévaut sur les repères éditoriaux chiffrés du workflow. Découper seulement lorsque le besoin comporte réellement plusieurs livrables indépendants, selon le périmètre et les décisions du porteur."
]
