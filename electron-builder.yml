appId: fr.madness.desktop
productName: Madness
directories:
  output: dist
files:
  - out/**
  - resources/THIRD-PARTY-NOTICES.md
  - package.json
asar: true
extraResources:
  - from: resources/graphify
    to: graphify
  - from: resources/branding/madness.ico
    to: madness.ico
  - from: resources/bmad-help
    to: bmad-help
  - from: resources/bmad-init/payload-v1.json.gz
    to: bmad-init/payload-v1.json.gz
  - from: resources/bmad-script-runner.py
    to: bmad-script-runner.py
npmRebuild: false
win:
  icon: resources/branding/madness.ico
  executableName: Madness
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  runAfterFinish: false
  installerIcon: resources/branding/madness.ico
  uninstallerIcon: resources/branding/madness.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: Madness-${version}-${arch}-setup.${ext}
