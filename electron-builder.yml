appId: fr.madness.desktop
productName: Madness
directories:
  output: dist
files:
  - out/**
  - resources/THIRD-PARTY-NOTICES.md
  - package.json
asar: true
extraResources:
  - from: resources/bmad-help
    to: bmad-help
  - from: resources/bmad-script-runner.py
    to: bmad-script-runner.py
npmRebuild: false
win:
  executableName: Madness
  target:
    - target: nsis
      arch: [x64]
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
artifactName: Madness-${version}-${arch}-setup.${ext}
